<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Filter symbols by toggling a list</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.11.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
    </head>
<body>
<style>
    .filter-group {
        font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
        font-weight: 600;
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1;
        border-radius: 3px;
        width: 120px;
        color: #fff;
    }

    .filter-group input[type='checkbox']:first-child + label {
        border-radius: 3px 3px 0 0;
    }

    .filter-group label:last-child {
        border-radius: 0 0 3px 3px;
        border: none;
    }

    .filter-group input[type='checkbox'] {
        display: none;
    }

    .filter-group input[type='checkbox'] + label {
        background-color: #3386c0;
        display: block;
        cursor: pointer;
        padding: 10px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.25);
    }

    .filter-group input[type='checkbox'] + label {
        background-color: #3386c0;
        text-transform: capitalize;
    }

    .filter-group input[type='checkbox'] + label:hover,
    .filter-group input[type='checkbox']:checked + label {
        background-color: #4ea0da;
    }

    .filter-group input[type='checkbox']:checked + label:before {
        content: '✔';
        margin-right: 5px;
    }
</style>
<div id="map"></div>
<!-- add filter group nav here  ( II.6) -->
 <!--nav alerts browser to navigation links-->
 <nav id="filter-group" class="filter-group"></nav>

<script>
	mapboxgl.accessToken = 'pk.eyJ1Ijoiam9tZXJzb24iLCJhIjoiY2o1bXE2bHlyMnJhZDMzbnpyMnhlODdpcSJ9.QJMJ_cTFCY050aZfSn1umQ';
    
    // ADD THE DATA HERE (II.2)
    
    //Each value of "icon" corresponds w/Mapbox Light's sprite
    var places = {
        "type": "FeatureCollection",
     "features": [
         {
     	"type": "Feature",
     	"properties": {
     	    "icon": "theatre"
     	},
     	"geometry": {
     	    "type": "Point",
     	    "coordinates": [-77.038659, 38.931567]
     	}
         },
         {
     	"type": "Feature",
     	"properties": {
     	    "icon": "theatre"
     	},
     	"geometry": {
     	    "type": "Point",
     	    "coordinates": [-77.003168, 38.894651]
     	}
         },
         {
     	"type": "Feature",
     	"properties": {
     	    "icon": "bar"
     	},
     	"geometry": {
     	    "type": "Point",
     	    "coordinates": [-77.090372, 38.881189]
     	}
         },
         {
     	"type": "Feature",
     	"properties": {
     	    "icon": "bicycle"
     	},
     	"geometry": {
     	    "type": "Point",
     	    "coordinates": [-77.052477, 38.943951]
     	}
         },
         {
     	"type": "Feature",
     	"properties": {
     	    "icon": "music"
     	},
     	"geometry": {
     	    "type": "Point",
     	    "coordinates": [-77.031706, 38.914581]
     	}
         },
         {
     	"type": "Feature",
     	"properties": {
     	    "icon": "music"
     	},
     	"geometry": {
     	    "type": "Point",
     	    "coordinates": [-77.020945, 38.878241]
     	}
         },
         {
     	"type": "Feature",
     	"properties": {
     	    "icon": "music"
     	},
     	"geometry": {
     	    "type": "Point",
     	    "coordinates": [-77.007481, 38.876516]
     	}
         }
     ]
    }

    var filterGroup = document.getElementById('filter-group');

    //Boundaries
    var boundaries = [
        [-77.2, 38.77], //SW
        [-76.807, 39.04] //NE
        
    ]

    //Initialize map
    var map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v10',
        center: [-77.04, 38.907],
        minZoom: 10,
        maxZoom: 12.5,
        maxBounds: boundaries
    });

    

    // Map's On 'load' function.
    map.on('load', function () {
         // insert code in the function here  (II.3)
        //Mapbox source = data in "places" var, type = GeoJSON

        //Note: places, under 'data', must not be in quotations
        map.addSource('places',{
            'type': 'geojson',
            'data': places
        })
        //Create Mapbox Layer according to points w/in "type"

        /*var layerID = 'points';
            map.addLayer({
                'id': layerID,
                'type': 'symbol',
                'source': 'places',
                'layout':{
                    //All features use image called "marker-15"
                    'icon-image': 'marker-15',
                    'icon-allow-overlap': true
                }

            })*/

        //New layer using pts
        places.features.forEach(function(feature){
            var symbol = feature.properties['icon']; //Gets value from 'icon'
            var layerID = 'poi-' + symbol;

            //If no pre-existing layer for name, add layer
            if(!map.getLayer(layerID)){
                map.addLayer({
                    'id': layerID,
                    'type': 'symbol',
                    'source': 'places',
                    'layout':{
                        //Icons are Mapbox Light style
                        'icon-image': symbol + '-15',
                        'icon-allow-overlap': true
                    },
                    //Filter dataset for features w/identical icon and current 'symbol' value
                    'filter': ['==', 'icon', symbol]
                });
                //Add checkbox/label elements to layer
                var input=document.createElement('input');
                input.type = 'checkbox';
                input.id=layerID;
                input.checked=true;
                filterGroup.appendChild(input);

                var label=document.createElement('label');
                label.setAttribute('for',layerID);
                label.textContent=symbol;
                filterGroup.appendChild(label);

                //Checkbox changes, update layer visibility
                input.addEventListener('change', function(e){
                    map.setLayoutProperty(
                        layerID,
                        'visibility',
                        e.target.checked ? 'visible' : 'none'
                    );
                });

                //When click occurs on feature in 'places' layer, open popup at feature location w/HTML property description
                //Tl;dr build HTML description per pt
                map.on('click',layerID,function(e){
                    var coordinates = e.features[0].geometry.coordinates.slice();
                    var description="At this location in Washington DC, you'll find a " + e.features[0].properties.icon + " here";

                    new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(description) //Adds string in description var
                    .addTo(map);
                })

                //Changes cursor to pointer when mouse is over "places" layer in top-right corner
                map.on('mouseenter', layerID, function(){
                    map.getCanvas().style.cursor = 'pointer';
                });

                //Changes cursor to hand when mouse leaves "places" layer
                map.on('mouseleave', layerID, function(){
                    map.getCanvas().style.cursor = '';
                });
            }
        })
    });
</script>

</body>
</html>
