<!DOCTYPE html>
<html>

  <head>
    <meta charset='utf-8' />
    <title>University of Oregon Mapping</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
      <!--    The Mapbox JavaScript here in the <head> of the page    -->
      <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v1.1.0/mapbox-gl.js'></script>
      <!--    The Mapbox CSS here in the <head> of the page    -->
      <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v1.1.0/mapbox-gl.css' rel='stylesheet' />
      
      <!--   Insert Link to Google font-->
      <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">
      
    <style>
        /* CSS code between the <style> tags */
        body { margin:0; padding:0; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
        
        /* Overrides the pop-up width slightly bigger min-width than the default Mapbox CSS*/
         .mapboxgl-popup {
            min-width: 325px;
            /*add the css for the popup font here */
            font-family: "Henny Penny", system-ui;
            font-weight: 600;
        }
        
        
        /* The CSS for the "Fly" buttons.   */
        .fly {
            display: inline-block; /* displays over the map */
            position: relative; /* displays over the map */
            left: 75px; /*Moves all buttons further to center*/
            margin: 0px auto; 
            width: 30%;  /* width of parent div, aka width of buttons */
            padding: 10px;
            border-style: solid;
            border-color: oldlace;
            border-radius: 3px; /* rounded corners */
            font-size: 1em;
            font-family: "Henny Penny", system-ui;
            text-align: center;
            font-weight: 400;
            color: oldlace;
            background: DarkRed;
            cursor:pointer;
        }
        
        /* Makes the Yellowstone popup's image fit the box*/
        .popupImage{
            width:100%;
            font-family: "Henny Penny", system-ui;
            font-weight: 600;
        }
    </style>
  </head>

  <body>
      <!--  The map div -->
      <div id='map'></div>
      
       <!--  Insert the button elements here  -->
        <button class='fly' id='PortlandButton'> Jump to Portland</button>
        <button class='fly' id='LondonButton'> Jump to London</button>
        <button class='fly' id='YellowstoneButton'> Jump to Yellowstone</button>

    <script>
        // Insert the JavaScript within the <script> tags, within the body   
        // Start with the Mapbox access token
        mapboxgl.accessToken = 'pk.eyJ1Ijoiam9tZXJzb24iLCJhIjoiY2o1bXE2bHlyMnJhZDMzbnpyMnhlODdpcSJ9.QJMJ_cTFCY050aZfSn1umQ';

        // Initialize the map
        var map = new mapboxgl.Map({
            container: 'map', // id of a div on your page, where the map will be inserted
            style: 'mapbox://styles/mapbox/outdoors-v11', // stylesheet location
            center: [-122.6788, 45.5212], // Portland
            //center: [-0.1534307, 51.501223], // starting position [lng, lat] eg. [-122.6788, 45.5212]
            //center: [-110.74524187568,44.706216445069], // starting position [lng, lat] eg. [-122.6788, 45.5212]
            zoom: 13, // starting zoom 
        })

        //Disables unwanted interactions
        map.dragPan.disable(); //No panning by dragging mouse around
        map.scrollZoom.disable(); //No zooming w/scroll wheel
        map.boxZoom.disable();
        map.dragRotate.disable(); //No rotating w/right click
        map.keyboard.disable(); //No panning w/keyboard
        map.doubleClickZoom.disable(); //No zooming by double left clicking
        map.touchZoomRotate.disable();
        map.touchZoomRotate.disableRotation();

        //Makes mouse cursor the normal arrow
        map.getCanvas().style.cursor = "auto";

        /***  POPUPS  ***/
            // Part A III. markers go here
            var popup1_content = '<h2> Play the video to listen to Portland </h2><br>';

            //"+=" further contributes to var while keeping space tidy
            popup1_content += '<iframe width="300px" src="https://www.youtube.com/embed/z1AdmS-LqyA" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
            
            //Adding "target="_blank"" opens link in new tab
            popup1_content += 'Source: Ian Lind, <a href="https://www.youtube.com/embed/z1AdmS-LqyA" target="_blank">YouTube</a>';

            var popup1 = new mapboxgl.Popup({
                minWidth: '300px',
            })
            .setHTML(popup1_content);

            var popup2_content = '<h2> Play the video to listen to London in 1928 </h2><br>';

            //SoundCloud embed
            popup2_content += '<iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A892653091&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe> <div style="font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;"> <a href="https://soundcloud.com/londonstreetnoises" title="London Street Noises" target="_blank" style="color: #cccccc; text-decoration: none;">London Street Noises</a> · <a href="https://soundcloud.com/londonstreetnoises/cromwell-1928" title="London Cromwell Road / Queen&#x27;s Gate in 1928" target="_blank" style="color: #cccccc; text-decoration: none;">London Cromwell Road / Queen&#x27;s Gate in 1928</a></div>'
            
            //SoundCloud source. Adding "target="_blank"" opens link in new tab
            popup2_content += 'Source: LondonStreetNoises.co.uk, <a href="https://soundcloud.com/londonstreetnoises" target="_blank"> SoundCloud </a>';

            var popup2 = new mapboxgl.Popup({
                minWidth: '300px'
            })
            .setHTML(popup2_content);

            var popup3_content = '<h2> Play the video to listen to a bison eating. You may want to turn up your volume first. </h2><br>';
            popup3_content += '<audio controls><source src="sounds/yell-YELLBisonEating150313.mp3" type="audio/mpeg">Your browser does not support the audio element.</audio>';

            //Audio source
            popup3_content += 'Source: NPS/Jennifer Jerret, <a href="https://www.nps.gov/yell/learn/photosmultimedia/sounds-bisoneating.htm">NPS</a>';

            //Image
            popup3_content += '<img class ="popupImage" alt="A herd of bison standing along the Gibbon River." src ="https://www.nps.gov/yell/learn/photosmultimedia/images/ndh-yell-bison-gibbon_2.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp">';

            //Adding "target="_blank"" opens link in new tab
            popup3_content += 'Source: NPS/Neal Herbert, <a href="https://www.nps.gov/yell/learn/photosmultimedia/sounds-bisoneating.htm" target="_blank">NPS</a>';

            var popup3 = new mapboxgl.Popup({
                minWidth: '300px'
            })
            .setHTML(popup3_content);

        /***  END POPUPS  ***/  


        /***  MARKERS  ***/
            // Part A II. markers go here
        var marker1 = new mapboxgl.Marker({color: "DarkRed"})
            .setLngLat ([-122.6788,45.5212]) //Portland
            .setPopup(popup1)
            .addTo(map)

        var marker2 = new mapboxgl.Marker({color: "DarkRed"})
            .setLngLat ([-0.1534307, 51.501223]) //London
            .setPopup(popup2)
            .addTo(map)

        var marker3 = new mapboxgl.Marker({color: "DarkRed"})
            .setLngLat ([-110.74524187568,44.706216445069]) //Yellowstone
            .setPopup(popup3)
            .addTo(map)
            

        /***  END MARKERS  ***/
        
        /***  LISTENERS  ***/

            //Adds listener to the three buttons
            document.getElementById('LondonButton').addEventListener('click', function(){
                map.flyTo({
                    center: [-0.1534307, 51.501223],
                    zoom: 11,
                    zoomNum: map.zoom        
                    })
                
            })


            document.getElementById('PortlandButton').addEventListener('click', function(){
                map.flyTo({
                        center: [-122.6788, 45.5212],
                        zoom: 9,
                        zoomNum: map.zoom   
                    })
            })

            document.getElementById('YellowstoneButton').addEventListener('click', function(){
                map.flyTo({
                        center: [-110.74524187568,44.706216445069],
                        zoom: 9,
                        zoomNum: map.zoom  
                    })
                
            })

        /***  END LISTENERS  ***/
    </script>

  </body>

</html>
